<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let a = Number(prompt("enter no.1"));
        let b = Number(prompt("enter no.2"));
        let res = 1;
        function result(a, b) {
            res = a * b;
        }
        result(a, b);
        document.write(res);
    </script>
</body>

</html>
